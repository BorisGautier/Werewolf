<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName epicwolf.borisgauty.com

    ProxyPreserveHost On
    ProxyRequests Off

    # Admin Control Center Web
    ProxyPass /admin http://127.0.0.1:5900/admin
    ProxyPassReverse /admin http://127.0.0.1:5900/admin

    # API Routes (Admin & Health)
    ProxyPass /api http://127.0.0.1:5900/api
    ProxyPassReverse /api http://127.0.0.1:5900/api

    # Health public endpoint
    ProxyPass /health http://127.0.0.1:5900/health
    ProxyPassReverse /health http://127.0.0.1:5900/health

    # Grafana Dashboards
    ProxyPass /grafana http://127.0.0.1:5901
    ProxyPassReverse /grafana http://127.0.0.1:5901

    SSLCertificateFile /etc/letsencrypt/live/epicwolf.borisgauty.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/epicwolf.borisgauty.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
