<VirtualHost *:80>
    ServerName epicwolf.borisgauty.com

    ProxyPreserveHost On
    ProxyRequests Off

    # Grafana Dashboards (if installed)
    ProxyPass /grafana http://127.0.0.1:5901
    ProxyPassReverse /grafana http://127.0.0.1:5901

    # Proxy all traffic to Node.js Web & Admin Server (Landing Page, Admin UI & APIs)
    ProxyPass / http://127.0.0.1:5900/
    ProxyPassReverse / http://127.0.0.1:5900/
</VirtualHost>
