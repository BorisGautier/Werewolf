<VirtualHost *:80>
    ServerName epicwolf.borisgauty.com

    ProxyPreserveHost On
    ProxyRequests Off

    # Grafana Dashboards : Grafana centrale du VPS (organisation Werewolf)
    ProxyPass /grafana !
    RedirectMatch 302 ^/grafana(/.*)?$ https://grafana.borisgauty.com/d/werewolf-prod-dashboard/werewolf-production?orgId=2

    # Proxy all traffic to Node.js Web & Admin Server (Landing Page, Admin UI & APIs)
    ProxyPass / http://127.0.0.1:5900/
    ProxyPassReverse / http://127.0.0.1:5900/
</VirtualHost>
