services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "effective_cache_size=768MB"
    environment:
      POSTGRES_USER: werewolf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-werewolf}
      POSTGRES_DB: werewolf
    volumes:
      - werewolf-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U werewolf -d werewolf"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5905:5432"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  app:
    image: ${APP_IMAGE:-ghcr.io/borisgautier/werewolf:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://werewolf:${POSTGRES_PASSWORD:-werewolf}@db:5432/werewolf?schema=public
      BOT_TOKEN: ${BOT_TOKEN}
      DEV_USER_IDS: ${DEV_USER_IDS:-}
      ERROR_CHAT_ID: ${ERROR_CHAT_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: ${PORT:-4000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      # Required as of the V1 security fix: the admin dashboard's JWT signing secret used to be
      # read from a differently-named var that was never set here, silently falling back to a
      # secret hardcoded in the repo. It's now required in production - the app refuses to start
      # without it rather than repeat that mistake. Must be set in the deploy .env (ENV_FILE_CONTENT).
      JWT_SECRET: ${JWT_SECRET}
      # Optional: require `Authorization: Bearer <token>` on the Prometheus /metrics endpoint.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Optional: comma-separated origins allowed to call the admin API cross-origin. Leave unset
      # unless the dashboard is ever served from a different origin than this app itself.
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_TO_EMAIL: ${MAILGUN_TO_EMAIL:-}
      # Monitoring : pile centrale du VPS (/opt/observability). Les logs stdout sont
      # collectes par Vector -> Graylog (logs.borisgauty.com) ; /metrics est collecte
      # par le Prometheus central ; tableaux de bord sur grafana.borisgauty.com.
    ports:
      - "5900:4000"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.50'
          memory: 512M

volumes:
  werewolf-db-data:
