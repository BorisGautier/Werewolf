global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.mailgun.org:587'
  smtp_from: 'alerts@werewolf.local'
  smtp_auth_username: ''
  smtp_auth_password: ''

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  receiver: 'multi-channel-notifier'
  routes:
    - match:
        severity: critical
      receiver: 'critical-channel-notifier'

receivers:
  - name: 'multi-channel-notifier'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/disabled'
        channel: '#monitoring-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'

  - name: 'critical-channel-notifier'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/disabled'
        channel: '#critical-incidents'
        send_resolved: true
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'
    email_configs:
      - to: 'admin@werewolf.local'
        send_resolved: true
