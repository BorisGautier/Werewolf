name: CD - Production Build & Deploy

on:
  push:
    branches: [main]
    tags: ['20*.*', 'v*']

jobs:
  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Version Tag (yyyyMMdd.NumeroBuildJour)
        id: versioning
        run: |
          DATE=$(date +'%Y%m%d')
          BUILD_NUM=${{ github.run_number }}
          VERSION_TAG="${DATE}.${BUILD_NUM}"
          echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "Generated version tag: ${VERSION_TAG}"

      - name: Tag Git Repository & Push Tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="${{ steps.versioning.outputs.VERSION_TAG }}"
          if ! git rev-parse "${TAG_NAME}" >/dev/null 2>&1; then
            git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
            git push origin "${TAG_NAME}" || true
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.versioning.outputs.VERSION_TAG }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    name: Zero-Downtime Deploy & Rollback Guard (/var/www/werewolf)
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Remote Project Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            sudo mkdir -p /var/www/werewolf
            sudo chown -R $USER:$USER /var/www/werewolf

      - name: Copy Compose & Config Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.yml,deploy/,monitoring/"
          target: "/var/www/werewolf"

      - name: Execute Zero-Downtime Deployment & Automatic Rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /var/www/werewolf

            # 1. Écrire le fichier .env depuis les secrets GitHub
            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE_CONTENT }}
            EOF

            # 2. Configurer les VirtualHosts Apache2 (HTTP 80 & HTTPS 443)
            sudo mkdir -p /etc/apache2/sites-available
            sudo cp /var/www/werewolf/deploy/apache/epicwolf.borisgauty.com.conf /etc/apache2/sites-available/epicwolf.borisgauty.com.conf
            if [ -d "/etc/letsencrypt/live/epicwolf.borisgauty.com" ]; then
              sudo cp /var/www/werewolf/deploy/apache/epicwolf.borisgauty.com-le-ssl.conf /etc/apache2/sites-available/epicwolf.borisgauty.com-le-ssl.conf
            fi

            # 3. Activer les modules Apache & les VirtualHosts
            sudo a2enmod proxy proxy_http headers rewrite ssl || true
            sudo a2ensite epicwolf.borisgauty.com.conf || true
            if [ -f "/etc/apache2/sites-available/epicwolf.borisgauty.com-le-ssl.conf" ]; then
              sudo a2ensite epicwolf.borisgauty.com-le-ssl.conf || true
            fi

            # 4. Certification SSL Certbot Automatique (si non encore configuré)
            if [ ! -d "/etc/letsencrypt/live/epicwolf.borisgauty.com" ]; then
              sudo certbot --apache -d epicwolf.borisgauty.com --non-interactive --agree-tos -m admin@borisgauty.com --redirect || true
            fi
            sudo systemctl reload apache2 || true

            # 5. Activer le Mode Maintenance (suspend les nouvelles parties tout en laissant finir les parties actives)
            # /api/admin/maintenance requires a valid admin token as of the V2 security fix (it used
            # to be reachable with zero auth - see the audit) - log in against the currently-running
            # (old) container using ADMIN_PASSWORD from the .env just written above. If this fails
            # (e.g. first-ever deploy, nothing running yet) ADMIN_TOKEN stays empty and the maintenance
            # calls below just no-op via `|| true`, same graceful-degradation as before this fix.
            echo "🔐 Authentification admin pour le contrôle du mode maintenance..."
            ADMIN_PASSWORD_ENV=$(grep -E '^ADMIN_PASSWORD=' .env | head -1 | cut -d '=' -f2-)
            ADMIN_PASSWORD_JSON=$(printf '%s' "$ADMIN_PASSWORD_ENV" | sed 's/\\/\\\\/g; s/"/\\"/g')
            ADMIN_TOKEN=$(curl -s -X POST http://localhost:5900/api/admin/login \
              -H "Content-Type: application/json" \
              -d "{\"password\": \"${ADMIN_PASSWORD_JSON}\"}" \
              | grep -o '"token":"[^"]*"' | cut -d'"' -f4 || true)

            echo "🛠️ Activation du Mode Maintenance pour le déploiement..."
            curl -s -X POST http://localhost:5900/api/maintenance -H "Content-Type: application/json" -H "Authorization: Bearer ${ADMIN_TOKEN}" -d '{"enabled": true}' || true

            # 6. Attente gracieuse : attendre la fin des parties en cours (Max 300s / 5 minutes)
            echo "🔎 Attente de l'extinction naturelle des parties en cours..."
            MAX_WAIT=300
            WAIT_TIME=0
            GAMES_FINISHED=false
            while [ $WAIT_TIME -lt $MAX_WAIT ]; do
              ACTIVE_GAMES=$(curl -s http://localhost:5900/api/health | grep -o '"activeGames":[0-9]*' | cut -d':' -f2 || echo "0")
              if [ "$ACTIVE_GAMES" = "0" ] || [ -z "$ACTIVE_GAMES" ]; then
                echo "✅ Toutes les parties sont terminées ! Démarrage de la mise à jour..."
                GAMES_FINISHED=true
                break
              fi
              echo "⏳ ${ACTIVE_GAMES} partie(s) en cours... Attente de leur fin naturelle (${WAIT_TIME}s/${MAX_WAIT}s)"
              sleep 15
              WAIT_TIME=$((WAIT_TIME + 15))
            done

            # Si des parties sont TOUJOURS en cours après 5 minutes, Désactiver la maintenance et reporter
            if [ "$GAMES_FINISHED" = "false" ]; then
              FINAL_GAMES=$(curl -s http://localhost:5900/api/health | grep -o '"activeGames":[0-9]*' | cut -d':' -f2 || echo "0")
              if [ "$FINAL_GAMES" != "0" ] && [ -n "$FINAL_GAMES" ]; then
                echo "🛑 DÉPLOIEMENT REPORTÉ : ${FINAL_GAMES} partie(s) sont toujours en cours après 5 minutes."
                curl -s -X POST http://localhost:5900/api/maintenance -H "Content-Type: application/json" -H "Authorization: Bearer ${ADMIN_TOKEN}" -d '{"enabled": false}' || true
                echo "🛡️ Mode maintenance désactivé. Aucune partie n'a été interrompue."
                exit 1
              fi
            fi

            # 6. Sauvegarder l'ID de l'image précédente pour le Rollback
            PREV_IMAGE=$(docker inspect --format='{{.Image}}' werewolf-app-1 2>/dev/null || echo "")

            # 7. Pull de la nouvelle image Docker
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull

            # 8. Redémarrage de tous les services (App, DB, Grafana, Prometheus, Loki)
            echo "🚀 Redémarrage de tous les services..."
            docker compose up -d --remove-orphans

            # 10. Vérification de santé (Health Check) & Procédure de ROLLBACK Automatique
            echo "🧪 Contrôle de santé (Health Check) du nouveau conteneur..."
            HEALTHY=false
            for i in {1..12}; do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5900/api/health || echo "000")
              if [ "$HTTP_STATUS" = "200" ]; then
                HEALTHY=true
                echo "✅ Le nouveau conteneur est en parfaite santé (HTTP 200) !"
                break
              fi
              echo "⏳ Attente du démarrage du serveur ($i/12)..."
              sleep 5
            done

            # Si le conteneur n'est PAS Healthy -> ROLLBACK IMMÉDIAT
            if [ "$HEALTHY" = "false" ]; then
              echo "🚨 ÉCHEC DU HEALTH CHECK ! Affichage des derniers logs du conteneur :"
              docker compose logs --tail=100 app || true
              echo "Exécution de la procédure de ROLLBACK..."
              if [ -n "$PREV_IMAGE" ]; then
                echo "⏪ Restauration de l'image précédente: $PREV_IMAGE"
                docker compose stop app
                REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
                docker tag "$PREV_IMAGE" "ghcr.io/${REPO_LOWER}:latest"
                docker compose up -d app
                echo "⚠️ Rollback effectué avec succès. L'ancienne version stable a été restaurée !"
              else
                echo "❌ Impossible d'effectuer un rollback: aucune ancienne image enregistrée."
              fi
              exit 1
            fi

            # 11. Nettoyage des anciennes images inutilisées
            docker image prune -f
