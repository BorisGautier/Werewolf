name: werewolf-ts CI

on:
  push:
    branches: [master, main]
    paths:
      - 'werewolf-ts/**'
      - '.github/workflows/werewolf-ts-ci.yml'
  pull_request:
    paths:
      - 'werewolf-ts/**'
      - '.github/workflows/werewolf-ts-ci.yml'

defaults:
  run:
    working-directory: werewolf-ts

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: werewolf-ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Type-check (src + tests)
        run: npx tsc --noEmit -p tsconfig.eslint.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
